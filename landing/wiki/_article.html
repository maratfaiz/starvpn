<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:root{
  --gold:#FFB800;--gold2:#FFD84D;
  --gold-border:rgba(255,184,0,0.2);
  --gold-dim:rgba(255,184,0,0.1);
  --bg:#060606;--bg2:rgba(255,255,255,0.025);
  --text:#EBE0CC;--text2:#8A7A60;--text3:#3A3028;
  --navmax:1320px;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.7;overflow-x:hidden}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,184,0,.2);border-radius:2px}
.layout{position:relative;z-index:2;max-width:var(--navmax);margin:0 auto;padding:clamp(24px,3vw,44px) 20px 0;display:grid;grid-template-columns:1fr;gap:clamp(24px,3vw,48px);align-items:start}
@media(min-width:1000px){.layout{grid-template-columns:250px minmax(0,1fr)}}
@media(min-width:1240px){.layout{grid-template-columns:250px minmax(0,1fr) 210px}}
.side-nav{display:none;position:sticky;top:88px;max-height:calc(100vh - 108px);overflow:auto;padding-bottom:24px}
@media(min-width:1000px){.side-nav{display:block}}
.side-group{margin-bottom:24px}
.side-group-title{font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-left:12px}
.side-items{display:flex;flex-direction:column;gap:2px}
.side-item{font-size:13.5px;line-height:1.45;padding:8px 12px;border-radius:9px;border:1px solid transparent;color:var(--text2)}
.side-item:hover{color:var(--gold)}
.side-item.current{border-color:rgba(255,184,0,.3);color:var(--gold);background:rgba(255,184,0,.07)}

.crumbs{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--text3);margin-bottom:20px;flex-wrap:wrap}
.crumbs a{color:var(--text2)}
article h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,4.4vw,50px);font-weight:700;line-height:1.08;letter-spacing:-.02em;margin-bottom:18px}






.toc{display:none;position:sticky;top:88px;padding-bottom:24px}
@media(min-width:1240px){.toc{display:block}}
.toc-label{font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.toc-items{display:flex;flex-direction:column;gap:9px;border-left:1px solid rgba(255,255,255,.09);padding-left:14px}
.toc-items a{font-size:13px;line-height:1.45;color:var(--text2)}
.toc-items a:hover{color:var(--gold)}

footer{position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.07)}
.footer-inner{max-width:var(--navmax);margin:0 auto;padding:36px 20px;display:flex;gap:22px;flex-wrap:wrap;justify-content:space-between;font-size:12.5px;color:var(--text3)}
.footer-inner a{color:var(--text2)}
.footer-links{display:flex;gap:20px;flex-wrap:wrap}


/* ── Элементы визуального редактора статей (админка → Wiki) ── */
.doc-meta-row{display:flex;gap:16px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text3);padding-bottom:28px;margin-bottom:36px;border-bottom:1px solid rgba(255,255,255,.08)}
article h3{font-family:'Space Grotesk',sans-serif;font-size:clamp(19px,2.2vw,23px);font-weight:600;line-height:1.3;margin:28px 0 12px}
article ul,article ol{margin:0 0 18px;padding-left:24px}
article li{margin-bottom:8px}
article li::marker{color:var(--gold)}
article blockquote{border-left:3px solid var(--gold);background:rgba(255,184,0,.05);border-radius:0 12px 12px 0;padding:14px 20px;margin:0 0 20px;color:var(--text)}
article img{max-width:100%;height:auto;border-radius:14px;margin:6px 0 20px;display:block}
article hr{border:none;border-top:1px solid rgba(255,255,255,.08);margin:32px 0}
article pre{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:18px 20px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.8;color:var(--text2);overflow-x:auto;margin-bottom:22px;white-space:pre-wrap}
article pre code{background:none;padding:0;color:inherit}
article table{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:14.5px}
article th,article td{border:1px solid rgba(255,255,255,.08);padding:10px 14px;text-align:left;vertical-align:top}
article th{color:var(--text);font-weight:600;background:rgba(255,255,255,.03)}
.callout{display:flex;gap:14px;align-items:flex-start;background:rgba(255,184,0,.06);border:1px solid rgba(255,184,0,.2);border-radius:16px;padding:18px 22px;margin:0 0 24px;color:var(--text);font-size:14.5px;line-height:1.7}
.callout::before{content:"!";flex-shrink:0;width:24px;height:24px;border-radius:8px;background:var(--gold);color:#000;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.side-empty{font-size:13px;color:var(--text3);padding:8px 12px}
figure.wimg{margin:6px auto 24px;max-width:100%}
figure.wimg[data-align=left]{margin-left:0}
figure.wimg[data-align=right]{margin-right:0}
figure.wimg img{width:100%;margin:0}
figure.wimg figcaption{font-size:13px;line-height:1.5;color:var(--text3);text-align:center;margin-top:10px}
details.toggle{border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.02);margin:0 0 18px;padding:0 20px}
details.toggle>summary{list-style:none;cursor:pointer;position:relative;padding:14px 0 14px 24px;font-weight:500;color:var(--text)}
details.toggle>summary::-webkit-details-marker{display:none}
details.toggle>summary::before{content:"";position:absolute;left:2px;top:50%;width:7px;height:7px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:translateY(-70%) rotate(-45deg);transition:transform .2s}
details.toggle[open]>summary::before{transform:translateY(-60%) rotate(45deg)}
details.toggle>:not(summary){margin-left:24px}
details.toggle>:last-child:not(summary){margin-bottom:16px}
article td>:last-child,article th>:last-child{margin-bottom:0}
@media(max-width:640px){.layout figure.wimg{width:100%!important}article table{display:block;overflow-x:auto}}
/*__WIKI_CUSTOM_CSS__*/

<script>
/* ═══ Starfield ══════════════════════════════════════════════ */
(function(){
  const c = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  function resize(){ c.width = innerWidth; c.height = innerHeight; }
  resize(); window.addEventListener('resize', resize, {passive:true});
  const stars = Array.from({length:60}, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.2 + 0.15,
    o: Math.random() * 0.5 + 0.1,
    sp: Math.random() * 0.0004 + 0.00006,
    ph: Math.random() * Math.PI * 2,
  }));
  let f = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height); f++;
    for(const s of stars){
      const a = s.o * (0.4 + 0.6 * Math.sin(f * s.sp * 200 + s.ph));
      ctx.beginPath();
      ctx.arc(s.x*c.width, s.y*c.height, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,216,120,${a})`; ctx.fill();
    }
    if(!reduced) requestAnimationFrame(draw);
  }
  draw();
})();

</script>

<script>
/* ═══ Виджеты статей — работают в любой статье, где есть нужная разметка ═══ */
/* Аккордеоны FAQ и «Неполадок» */
[['.faq-btn', '.faq-item', '.faq-sign'], ['.case-btn', '.case-item', '.case-sign']].forEach(([btnSel, itemSel, signSel]) => {
  document.querySelectorAll(btnSel).forEach(btn => {
    btn.addEventListener('click', () => {
      const item = btn.closest(itemSel);
      item.classList.toggle('open');
      const sign = btn.querySelector(signSel);
      if (sign) sign.textContent = item.classList.contains('open') ? '−' : '+';
    });
  });
});

/* Поиск по FAQ */
(function(){
  const input = document.getElementById('faq-search');
  if (!input) return;
  const items = Array.from(document.querySelectorAll('.faq-item'));
  const groups = Array.from(document.querySelectorAll('[data-group]'));
  const empty = document.getElementById('empty-note');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    let visible = 0;
    items.forEach(item => {
      const match = !q || item.textContent.toLowerCase().includes(q);
      item.style.display = match ? '' : 'none';
      item.classList.toggle('open', match && !!q);
      const sign = item.querySelector('.faq-sign');
      if (sign) sign.textContent = item.classList.contains('open') ? '−' : '+';
      if (match) visible++;
    });
    groups.forEach(g => {
      const shown = g.querySelectorAll('.faq-item:not([style*="display: none"])');
      g.style.display = shown.length ? '' : 'none';
    });
    if (empty) empty.classList.toggle('show', visible === 0);
  });
})();

/* Вкладки клиентов в инструкциях по подключению */
document.querySelectorAll('.client-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.client-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.client-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    const panel = document.querySelector(`.client-panel[data-panel="${tab.dataset.client}"]`);
    if (panel) panel.classList.add('active');
  });
});

/* Выбор источника подписки (сайт / Telegram) */
(function(){
  const titleEl = document.getElementById('source-hint-title');
  const textEl = document.getElementById('source-hint-text');
  if (!titleEl || !textEl) return;
  const hints = {
    site: { title: 'Вы выбрали сайт', text: 'Ссылку подписки покажет страница оплаты. Сохраните её: аккаунта на сайте нет, и повторно выдать ключ можно только через поддержку.' },
    telegram: { title: 'Вы выбрали Telegram', text: 'Ссылка всегда доступна в боте по кнопке «Моя подписка» — её можно скопировать заново в любой момент.' },
    null: { title: 'Что выбрать', text: 'Если Telegram открывается — берите ссылку в боте: там продление, статус и поддержка. Если нет — покупайте ключ на сайте.' },
  };
  let channel = null;
  try { const saved = localStorage.getItem('star_vpn_channel'); if (saved === 'site' || saved === 'telegram') channel = saved; } catch(e){}
  function apply(){
    document.querySelectorAll('.source-card').forEach(card => card.classList.toggle('active', card.dataset.source === channel));
    const h = hints[channel] || hints.null;
    titleEl.textContent = h.title;
    textEl.textContent = h.text;
  }
  document.querySelectorAll('.source-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.source-cta')) return;
      channel = card.dataset.source;
      try { localStorage.setItem('star_vpn_channel', channel); } catch(e){}
      apply();
    });
  });
  apply();
})();
</script>
