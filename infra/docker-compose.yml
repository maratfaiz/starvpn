version: "3.9"

# ─────────────────────────────────────────────
#  STAR VPN — Docker Compose
#  Services: bot | db
#  NOTE: Marzban runs separately in /opt/marzban
# ─────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starvpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-starvpn}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starvpn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Telegram Bot + Mini App API ─────────────
  bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8080:8080"   # Mini App API → Netlify proxy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  pg_data:

networks:
  internal:
    driver: bridge
