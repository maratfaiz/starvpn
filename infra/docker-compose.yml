# ─────────────────────────────────────────────
#  STAR VPN — Docker Compose
#  Services: bot | db
#  NOTE: Marzban + Xray-core живут ОТДЕЛЬНО в /opt/marzban со своим
#        docker-compose (ставится штатным установщиком Marzban) и в этот
#        файл намеренно не включены: свой жизненный цикл и свои апдейты.
#        Бот ходит в его API по MARZBAN_URL из .env.
# ─────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starvpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-starvpn}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starvpn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Telegram Bot + Mini App API ─────────────
  bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    ports:
      # Только loopback: наружу порт отдаёт nginx (infra/nginx.conf) по HTTPS.
      # Публикация на 0.0.0.0 открыла бы сайт и API по голому HTTP мимо TLS.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  pg_data:

networks:
  internal:
    driver: bridge
