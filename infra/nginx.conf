# STAR VPN — nginx reverse proxy
# Проксирует HTTPS → bot API (порт 8080)
# Установка: скопируй в /etc/nginx/sites-available/starvpn
# и запусти: certbot --nginx -d твой.домен.ru

server {
    listen 80;
    server_name api.starvpnservice.ru;  # <-- замени на свой домен/поддомен

    # Certbot добавит HTTPS-блок автоматически
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
